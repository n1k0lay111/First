<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя страница</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 16px;
        }

        p {
            font-size: 1rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        button {
            background-color: #3498db;
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        #message {
            margin-top: 20px;
            font-size: 1rem;
            color: #27ae60;
            min-height: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Привет, мир!</h1>
        <p>Это простая HTML-страница с базовыми стилями и интерактивной кнопкой.</p>
        <button onclick="showMessage()">Нажми меня</button>
        <div id="message"></div>
    </div>

    <script>
        function showMessage() {
            document.getElementById('message').textContent = 'Привет! Кнопка работает!';
        }
    </script>
</body>
</html>
