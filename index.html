<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Змейка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            padding: 0 8px 10px;
            color: #fff;
        }
        .stat { text-align: center; }
        .stat-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 26px; font-weight: bold; color: #00e676; }
        #best-value { color: #ffd740; }
        canvas {
            border-radius: 12px;
            display: block;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0,0,0,0.80);
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            text-align: center;
        }
        #overlay h1 { font-size: 28px; }
        #overlay .sub { font-size: 15px; color: #aaa; }
        #overlay .hint { font-size: 13px; color: #666; }
        #overlay .score-display { font-size: 42px; font-weight: bold; color: #00e676; }
        #overlay .best-display { font-size: 16px; color: #ffd740; }
        #btn {
            margin-top: 6px;
            padding: 14px 36px;
            background: #00e676;
            color: #1a1a2e;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        #btn:active { transform: scale(0.96); }
        #swipe-hint {
            position: absolute;
            bottom: 24px;
            color: #444;
            font-size: 13px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="header">
    <div class="stat">
        <div class="stat-label">Счёт</div>
        <div class="stat-value" id="score-val">0</div>
    </div>
    <div class="stat">
        <div class="stat-label">Рекорд</div>
        <div class="stat-value" id="best-value">0</div>
    </div>
</div>

<div style="position:relative; display:inline-block;">
    <canvas id="c"></canvas>
    <div id="overlay">
        <h1>🐍 Змейка</h1>
        <div class="sub">Собирай еду, не врезайся!</div>
        <div class="hint">Свайп — управление<br>Стрелки / WASD — с клавиатуры</div>
        <button id="btn" onclick="startGame()">Начать игру</button>
    </div>
</div>

<div id="swipe-hint">Свайп для управления</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const SIZE    = Math.min(400, window.innerWidth - 16);
const COLS    = 20;
const CELL    = Math.floor(SIZE / COLS);
const W       = COLS * CELL;
canvas.width  = W;
canvas.height = W;

const overlay   = document.getElementById('overlay');
const scoreEl   = document.getElementById('score-val');
const bestEl    = document.getElementById('best-value');

let snake, dir, nextDir, food, score, best, running, interval, speed;
best = 0;

const COLORS = {
    bg:      '#16213e',
    grid:    '#0f3460',
    head:    '#00e676',
    body:    '#00c853',
    tail:    '#69f0ae',
    food:    '#ff5252',
    foodGlow:'rgba(255,82,82,0.3)',
    eye:     '#fff',
    pupil:   '#1a1a2e',
};

function rand(max) { return Math.floor(Math.random() * max); }

function placeFood() {
    let pos;
    do {
        pos = { x: rand(COLS), y: rand(COLS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
}

function startGame() {
    snake   = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir     = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score   = 0;
    speed   = 130;
    scoreEl.textContent = 0;
    overlay.style.display = 'none';
    placeFood();
    running = true;
    clearInterval(interval);
    interval = setInterval(tick, speed);
}

function setSpeed(s) {
    clearInterval(interval);
    speed = s;
    interval = setInterval(tick, speed);
}

function tick() {
    dir = { ...nextDir };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= COLS) { gameOver(); return; }
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        if (score > best) { best = score; bestEl.textContent = best; }
        placeFood();
        // Speed up every 5 points
        if (score % 5 === 0 && speed > 60) setSpeed(speed - 8);
    } else {
        snake.pop();
    }

    draw();
}

function gameOver() {
    clearInterval(interval);
    running = false;
    overlay.innerHTML = `
        <h1>Игра окончена!</h1>
        <div class="score-display">${score}</div>
        <div class="best-display">Рекорд: ${best}</div>
        <button id="btn" onclick="startGame()">Играть снова</button>
    `;
    overlay.style.display = 'flex';
}

/* ── Drawing ── */

function drawRoundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
}

let foodPulse = 0;

function draw() {
    // Background
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, W);

    // Grid
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= COLS; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, W); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(W, i * CELL); ctx.stroke();
    }

    // Food glow
    foodPulse += 0.12;
    const glow = 8 + Math.sin(foodPulse) * 4;
    ctx.shadowColor = COLORS.food;
    ctx.shadowBlur  = glow;
    ctx.fillStyle   = COLORS.food;
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.38, 0, Math.PI * 2);
    ctx.fill();
    // Apple stem
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ff8a65';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(fx, fy - CELL * 0.38);
    ctx.lineTo(fx + 3, fy - CELL * 0.5);
    ctx.stroke();

    ctx.shadowBlur = 0;

    // Snake body
    for (let i = snake.length - 1; i >= 0; i--) {
        const s  = snake[i];
        const px = s.x * CELL + 1;
        const py = s.y * CELL + 1;
        const sz = CELL - 2;

        if (i === 0) {
            // Head
            ctx.shadowColor = COLORS.head;
            ctx.shadowBlur  = 10;
            ctx.fillStyle   = COLORS.head;
            drawRoundRect(px, py, sz, sz, 5);
            ctx.shadowBlur  = 0;

            // Eyes
            const ex = dir.x === 1 ? 0.65 : dir.x === -1 ? 0.2 : 0.3;
            const ey = dir.y === 1 ? 0.65 : dir.y === -1 ? 0.2 : 0.3;
            const ex2 = dir.x !== 0 ? ex : 0.7;
            const ey2 = dir.y !== 0 ? ey : 0.3;

            ctx.fillStyle = COLORS.eye;
            ctx.beginPath(); ctx.arc(px + sz * ex,  py + sz * ey,  3.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(px + sz * ex2, py + sz * ey2, 3.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = COLORS.pupil;
            ctx.beginPath(); ctx.arc(px + sz * ex  + dir.x, py + sz * ey  + dir.y, 1.8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(px + sz * ex2 + dir.x, py + sz * ey2 + dir.y, 1.8, 0, Math.PI * 2); ctx.fill();
        } else {
            const t = i / snake.length;
            const g = Math.round(200 - t * 80);
            ctx.fillStyle = `rgb(0, ${g}, ${Math.round(80 + t * 30)})`;
            drawRoundRect(px + 1, py + 1, sz - 2, sz - 2, 4);
        }
    }
}

/* ── Controls ── */

const KEY_MAP = {
    ArrowUp:    { x: 0,  y: -1 },
    ArrowDown:  { x: 0,  y:  1 },
    ArrowLeft:  { x: -1, y:  0 },
    ArrowRight: { x: 1,  y:  0 },
    w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
    s: { x: 0, y:  1 }, S: { x: 0, y:  1 },
    a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
    d: { x: 1,  y: 0 }, D: { x: 1,  y: 0 },
};

document.addEventListener('keydown', e => {
    const d = KEY_MAP[e.key];
    if (d && running && !(d.x === -dir.x && d.y === -dir.y)) {
        nextDir = d;
        e.preventDefault();
    }
});

let touchStart = null;
canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });

canvas.addEventListener('touchend', e => {
    if (!touchStart || !running) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    let d;
    if (Math.abs(dx) > Math.abs(dy)) {
        d = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
    } else {
        d = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
    }
    if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
    touchStart = null;
}, { passive: true });

// Initial draw
draw();
</script>
</body>
</html>
